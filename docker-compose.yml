services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sicepot_app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sicepot
      DB_USERNAME: postgres
      DB_PASSWORD: manchester

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - sicepot_network


  nginx:
    image: nginx:1.29-alpine

    container_name: sicepot_nginx

    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - sicepot_network


  postgres:
    image: postgres:16-alpine

    container_name: sicepot_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: sicepot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester

    volumes:
      - sicepot_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d sicepot"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - sicepot_network


  redis:
    image: redis:7-alpine

    container_name: sicepot_redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - sicepot_redis_data:/data

    networks:
      - sicepot_network


volumes:
  sicepot_postgres_data:
    name: sicepot_postgres_data

  sicepot_redis_data:
    name: sicepot_redis_data


networks:
  sicepot_network:
    name: sicepot_network
    driver: bridge