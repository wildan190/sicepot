server {
    listen 80;
    listen [::]:80;

    server_name sicepot.com www.sicepot.com;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Maximum upload size
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Don't expose sensitive Laravel files
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|vite\.config\.(js|ts)|phpunit\.xml|\.env|\.git) {
        deny all;
    }

    # Static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # Disable logging for favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Disable logging for robots
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}